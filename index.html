<!DOCTYPE html>
<html>
<head>
    <title>Phonora Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- MENU -->
    <div id="menu" class="screen">
        <h1>🎤 Phonora</h1>
        <button class="btn" onclick="goToRoles()">Start Game</button>
    </div>

    <!-- ROLE -->
    <div id="roles" class="screen hidden">
        <h2>Select Role</h2>
        <div class="grid">
            <button onclick="selectRole('pilot')">Pilot</button>
            <button onclick="selectRole('news')">News</button>
            <button onclick="selectRole('service')">Service</button>
            <button onclick="selectRole('host')">Host</button>
            <button onclick="selectRole('minister')">Minister</button>
        </div>
    </div>

    <!-- LEVEL -->
    <div id="levels" class="screen hidden">
        <h2>Select Difficulty</h2>
        <button onclick="startGame('easy')">Easy</button>
        <button onclick="startGame('medium')">Medium</button>
        <button onclick="startGame('hard')">Hard</button>
    </div>

    <!-- GAME -->
    <div id="game">

    <!-- TOP BAR -->
    <div class="top-bar">
        <span id="score">⭐ 0</span>
        <span id="hearts">❤️❤️❤️❤️❤️❤️</span>
    </div>

    <!-- GAME WORLD -->
    <div class="game-world">

        <!-- SKY / CITY -->
        <div class="background"></div>
        <div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

        <!-- CHARACTER -->
        <div id="character">🧍</div>

        <!-- OBSTACLE -->
        <div id="obstacle">👾</div>

        <!-- FINISH -->
        <div id="finish">🏰</div>

    </div>

    <!-- PROMPT POPUP -->
    <div id="promptBox" class="hidden">
    <p id="script"></p>

    <!-- ✅ FEEDBACK stays here -->
    <div id="feedback"></div>

    <button onclick="startListening()">🎤 Speak</button>
</div>

</div>
<!-- TEST AUDIO (optional) -->
<button onclick="speakWord('hello')">🔊 Test Sound</button>

<script src="script.js"></script>

</body>
</html>
