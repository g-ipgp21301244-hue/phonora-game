<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phonora Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= MENU ================= -->
<div id="menu">
    <button class="start-btn" onclick="goToRoles()">Start Game</button>
</div>

<!-- ================= ROLE SELECTION ================= -->
<div id="roles" class="hidden">
    <h2>Select Role</h2>

    <button onclick="selectRole('pilot')">✈️ Pilot</button>
    <button onclick="selectRole('service')">☎️ Service</button>
    <button onclick="selectRole('anchor')">📰 Anchor</button>
    <button onclick="selectRole('host')">🎤 Host</button>
    <button onclick="selectRole('minister')">🏛️ Minister</button>
</div>

<!-- ================= LEVEL SELECTION ================= -->
<div id="levels" class="hidden">
    <h2>Select Level</h2>

    <button onclick="startGame('easy')">Easy</button>
    <button onclick="startGame('medium')">Medium</button>
    <button onclick="startGame('hard')">Hard</button>
</div>

<!-- ================= GAME ================= -->
<div id="game" class="hidden">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div id="hearts"></div>
        <div id="score"></div>
    </div>

    <!-- GAME WORLD -->
    <div class="game-world">

        <!-- CHARACTER -->
        <div id="character">🧍</div>

        <!-- MONSTER -->
        <div id="obstacle">👾</div>

        <!-- STAR -->
        <div id="star">⭐</div>

        <!-- LIGHTNING -->
        <div id="lightning">⚡</div>

        <!-- PROMPT BOX -->
        <div id="promptBox" class="hidden">
            <div id="script"></div>
            <div id="feedback"></div>
        </div>

    </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
