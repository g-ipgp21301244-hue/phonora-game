<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phonora Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU -->
<div id="menu">
    <button onclick="goToRoles()">Start Game</button>
</div>

<!-- ROLES -->
<div id="roles" class="hidden">
    <h2>Select Role</h2>
    <button onclick="selectRole('pilot')">Pilot</button>
    <button onclick="selectRole('service')">Service</button>
</div>

<!-- LEVEL -->
<div id="levels" class="hidden">
    <h2>Select Level</h2>
    <button onclick="startGame('easy')">Easy</button>
</div>

<!-- GAME -->
<div id="game" class="hidden">

    <div id="hearts"></div>
    <div id="score"></div>

    <div id="character">🧍</div>
    <div id="obstacle">👾</div>

    <div id="promptBox">
        <div id="script"></div>
        <div id="feedback"></div>
        <button onclick="startListening()">🎤 Speak</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
