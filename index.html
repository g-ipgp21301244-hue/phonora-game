<!DOCTYPE html>
<html>
<head>
    <title>Phonora Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- MENU -->
    <div id="menu" class="screen">
        <h1>🎤 Phonora</h1>
        <button class="btn" onclick="goToRoles()">Start Game</button>
    </div>

    <!-- ROLE -->
    <div id="roles" class="screen hidden">
        <h2>Select Role</h2>
        <div class="grid">
            <button onclick="selectRole('pilot')">Pilot</button>
            <button onclick="selectRole('news')">News</button>
            <button onclick="selectRole('service')">Service</button>
            <button onclick="selectRole('host')">Host</button>
            <button onclick="selectRole('minister')">Minister</button>
        </div>
    </div>

    <!-- LEVEL -->
    <div id="levels" class="screen hidden">
        <h2>Select Difficulty</h2>
        <button onclick="startGame('easy')">Easy</button>
        <button onclick="startGame('medium')">Medium</button>
        <button onclick="startGame('hard')">Hard</button>
    </div>

    <!-- GAME -->
    <div id="game" class="screen hidden">

        <!-- 🗣️ SPEAKING PROMPT -->
        <h2 id="roleTitle"></h2>
<h3 id="missionTitle"></h3>

<div class="progress-container">
    <div id="progressBar"></div>
</div>
        <div class="prompt-box">
            <p id="script"></p>
        </div>

        <!-- 🎤 SPEAK BUTTON -->
        <button class="mic-btn" onclick="startListening()">🎤</button>

        <!-- 🎮 GAME WORLD -->
        <div class="world">
            <div id="character">🧍</div>
            <div id="star">⭐</div>
            <div id="enemy">👾</div>
            <div id="finish">🏰</div>
        </div>

        <!-- HUD -->
        <div class="hud">
            <span id="score">⭐ 0</span>
            <span id="hearts"></span>
        </div>

        <!-- QUEST -->
        <h3 id="questTitle">Quest 1</h3>

        <!-- FEEDBACK -->
        <div id="feedback"></div>

        <!-- CONTROLS -->
        <div style="margin-top:15px;">
            <button class="btn" onclick="nextRound()">➡️ Next</button>
            <button class="btn" onclick="goToMenu()">🏠 Menu</button>
        </div>

    </div>

</div>

<!-- TEST AUDIO (optional) -->
<button onclick="speakWord('hello')">🔊 Test Sound</button>

<script src="script.js"></script>

</body>
</html>
